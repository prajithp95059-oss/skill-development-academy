<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#120f2c;
    --ink-soft:#564f7a;
    --paper:#e6e1ee;
    --paper-dim:#d6cfe2;
    --violet:#7a4dff;
    --cyan:#18b9ac;
    --rose:#ef4d78;
    --space-deep:#05040f;
    --space-mid:#0e0a28;
    --line: rgba(18,15,44,0.18);
    --header-h: 84px;
    --max: 1720px;
    --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{overflow-x:hidden; width:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column;
    overflow-x:hidden;
  }
  a{text-decoration:none; color:inherit;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 32px;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif; line-height:1.08; letter-spacing:-0.01em;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 26px; border-radius:100px; font-weight:600; font-size:15px; cursor:pointer;
    border:none; font-family:inherit;
    transition:transform .35s cubic-bezier(.2,.9,.25,1), box-shadow .35s ease, background .3s ease, color .3s ease;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:hover{transform:translateY(-3px); box-shadow:0 14px 30px -12px rgba(19,27,51,0.55);}
  .btn-outline{border:1.5px solid var(--line); color:var(--ink); background:transparent;}
  .btn-outline:hover{border-color:var(--ink); transform:translateY(-3px);}
  .btn-login{
    border:1.5px solid var(--ink); border-radius:100px; padding:10px 22px;
    font-size:14px; font-weight:600; transition:background .3s ease, color .3s ease, border-color .3s ease;
  }
  .btn-login:hover{background:var(--ink); color:var(--paper);}

  /* ===== 404 HERO ===== */
  .nf-main{
    flex:1; min-height:100vh; display:flex; align-items:center;
    padding:40px 0;
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 60% 55% at 78% 18%, rgba(122,77,255,0.16), transparent 70%),
      radial-gradient(ellipse 50% 50% at 12% 85%, rgba(24,185,172,0.14), transparent 70%);
  }
  @media (max-width:760px){
    .wrap{padding:0 20px;}
  }
  .blueprint-dots{
    position:absolute; inset:0; z-index:0; opacity:0.5;
    background-image:radial-gradient(var(--line) 1.4px, transparent 1.4px);
    background-size:26px 26px;
    mask-image:radial-gradient(ellipse 60% 60% at 70% 30%, black 10%, transparent 75%);
  }
  .nf-wrap{position:relative; z-index:1; width:100%; text-align:center;}
  .nf-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--cyan); display:inline-flex; align-items:center; gap:10px; margin-bottom:22px;
  }
  .nf-eyebrow::before, .nf-eyebrow::after{content:''; width:22px; height:2px; background:var(--violet); display:inline-block;}
  .nf-code{
    font-size:clamp(96px, 20vw, 220px); font-weight:700; letter-spacing:-0.03em;
    background:linear-gradient(120deg, var(--ink) 30%, var(--violet) 65%, var(--rose) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1;
  }
  .nf-title{font-size:clamp(24px, 3.4vw, 38px); margin-top:10px;}
  .nf-copy{
    max-width:520px; margin:18px auto 0; color:var(--ink-soft); font-size:16px; line-height:1.65;
  }
  .nf-actions{
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:38px;
  }
  .nf-actions svg{width:16px; height:16px;}
  @media (max-width:480px){
    .nf-actions{flex-direction:column; width:100%;}
    .nf-actions .btn{width:100%;}
  }
</style>
</head>
<body>

<main class="nf-main">
  <div class="blueprint-dots"></div>
  <div class="wrap nf-wrap">
    <div class="nf-eyebrow">Error 404</div>
    <div class="nf-code">404</div>
    <h1 class="nf-title">This page took a detour.</h1>
    <p class="nf-copy">We couldn't find the page you were looking for — it may have been moved, renamed, or never existed. Let's get you back on track.</p>
    <div class="nf-actions">
      <button type="button" class="btn btn-outline" id="goBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Go Back
      </button>
      <a href="index.html" class="btn btn-primary">
        Go Home
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7"/><path d="M9 22V12h6v10"/></svg>
      </a>
    </div>
  </div>
</main>

<script>
/* Go back / Go home */
document.getElementById('goBackBtn').addEventListener('click', () => {
  if(window.history.length > 1){
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
});
</script>

</body>
</html>
